name = "geppen-checker"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# 実際のデプロイ時に、Cloudflare Pagesの環境変数として以下を設定する(値はチャットやリポジトリに含めない):
# GOOGLE_SERVICE_ACCOUNT_EMAIL  ... サービスアカウントのメールアドレス
# GOOGLE_SERVICE_ACCOUNT_KEY    ... サービスアカウントの秘密鍵(PEM形式)
# SHEET_ID_EMPLOYEES            ... Employeesスプレッドシートのファイル ID
# SHEET_ID_PAYROLL_RECORDS      ... PayrollRecordsスプレッドシートのファイル ID
# SHEET_ID_JUDGMENT_RESULTS     ... JudgmentResultsスプレッドシートのファイル ID
# SHEET_ID_GRADE_TABLE          ... GradeTableスプレッドシートのファイル ID
