<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月変チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: "#F6F4EF",
          surface: "#FFFFFF",
          "surface-container": "#F0EEE9",
          "surface-border": "#E5E0D8",
          "on-surface": "#1E293B",
          "on-surface-variant": "#64748B",
          "on-surface-disabled": "#94A3B8",
          primary: "#1F6F63",
          "primary-hover": "#17544B",
          "primary-container": "#E4F0EC",
          "on-primary": "#FFFFFF",
          applicable: "#DC2626",
          "applicable-bg": "#FEE2E2",
          "applicable-border": "#FCA5A5",
          "not-applicable": "#15803D",
          "not-applicable-bg": "#DCFCE7",
          "not-applicable-border": "#86EFAC",
          pending: "#B45309",
          "pending-bg": "#FEF3C7",
          "pending-border": "#FDE68A",
        },
        fontFamily: {
          sans: ["Inter", "Noto Sans JP", "sans-serif"],
          mono: ["JetBrains Mono", "SF Mono", "Menlo", "monospace"],
        },
      },
    },
  };
</script>
<style>
  body { background: #F6F4EF; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="font-sans text-on-surface">
  <header class="sticky top-0 z-10 bg-surface border-b border-surface-border">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center gap-6">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-white text-[18px]">stacked_bar_chart</span>
        </div>
        <div>
          <div class="font-bold text-[15px] leading-none text-primary">月変チェッカー</div>
          <div class="text-[11px] leading-none text-on-surface-variant mt-1">随時改定チェック管理</div>
        </div>
      </div>
      <nav class="flex items-center gap-1 ml-4" id="tabs">
        <button data-tab="dashboard" class="tab-btn px-3 py-2 rounded-lg text-sm font-semibold">ダッシュボード</button>
        <button data-tab="upload" class="tab-btn px-3 py-2 rounded-lg text-sm font-semibold">CSV取込</button>
        <button data-tab="employees" class="tab-btn px-3 py-2 rounded-lg text-sm font-semibold">対象者</button>
        <button data-tab="results" class="tab-btn px-3 py-2 rounded-lg text-sm font-semibold">判定結果</button>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <section id="view-dashboard" data-view></section>
    <section id="view-upload" data-view></section>
    <section id="view-employees" data-view></section>
    <section id="view-employee-detail" data-view></section>
    <section id="view-results" data-view></section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
